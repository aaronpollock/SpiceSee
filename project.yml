name: SpiceSee
options:
  bundleIdPrefix: com.spicesee
  deploymentTarget:
    macOS: "14.0"
packages:
  SpiceSee:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
targets:
  SpiceSee:
    type: application
    platform: macOS
    sources:
      - path: Sources/SpiceSee
        excludes: [Licenses]
      - path: Sources/SpiceSee/Licenses
        buildPhase: resources
    dependencies:
      - package: SpiceSee
        product: SpiceKit
      - package: Sparkle
    info:
      path: Sources/SpiceSee/Info.plist
      properties:
        CFBundleName: SpiceSee
        CFBundleDisplayName: SpiceSee
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 SCT"
        CFBundleDocumentTypes:
          - CFBundleTypeName: SPICE Connection
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [org.spice-space.vv]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.spice-space.vv
            UTTypeDescription: SPICE Connection
            UTTypeConformsTo: [public.data, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [vv]
    entitlements:
      path: Sources/SpiceSee/SpiceSee.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.network.client: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: com.spicesee.app
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ChiliRed
        MARKETING_VERSION: "1.0.0"
        # The release script passes the git commit count; a development build is visibly build 0.
        CURRENT_PROJECT_VERSION: "0"

  SpiceSeeTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the app's own sources rather than hosting the app: the Debug app is a launcher stub
    # plus SpiceSee.debug.dylib, which a TEST_HOST bundle cannot load reliably.
    sources:
      - path: Tests/SpiceSeeTests
      - path: Sources/SpiceSee
        excludes: [Licenses, Assets.xcassets, Info.plist, SpiceSee.entitlements]
      - path: Sources/SpiceSee/Licenses
        buildPhase: resources
    dependencies:
      - package: SpiceSee
        product: SpiceKit
      - package: Sparkle
    # An explicit scheme so coverage stays off: Xcode's implicit test scheme instruments the
    # CSpiceCodec package with -profile-generate but links the dynamic framework without the
    # profile runtime, and the link fails on ___llvm_profile_runtime.
    scheme:
      testTargets: [SpiceSeeTests]
      gatherCoverageData: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.spicesee.app.tests
